<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La boutique — ATLAS STREETWEAR</title>
<meta name="description" content="Tous les tee-shirts, hoodies et casquettes ATLAS. Paiement à la livraison en Tunisie.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">

<body>
<a class="saut-contenu" href="#contenu">Aller au contenu</a>

<main class="page page-large" id="contenu">

  <h2 class="hors-ecran">Articles</h2>

    <div class="squelette squelette-carte"></div>

    <div class="squelette squelette-carte"></div>

<script src="/js/i18n.js"></script>
<script src="/js/atlas.js"></script>
<script src="/js/carte-produit.js"></script>
