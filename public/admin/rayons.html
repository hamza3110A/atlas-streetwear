<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayons — Administration ATLAS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="app">
  <main class="principal">

    <div class="entete-page">
      <div>
        <h1 class="titre-page">Rayons</h1>
        <p class="sous-titre">Le menu du site se construit à partir de cette liste. Créez un rayon, il apparaît tout seul dans la navigation.</p>
      </div>
      <button class="btn btn--primaire" type="button" data-nouveau>+ Nouveau rayon</button>
    </div>

    <div class="panneau">
      <div class="table-boite">
        <table>
          <thead><tr><th>Rayon</th><th>Adresse sur le site</th><th class="num">Produits</th><th>Visible</th><th></th></tr></thead>
          <tbody data-liste><tr><td colspan="5" class="chargement">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/rayons.js"></script>
</body>
</html>
