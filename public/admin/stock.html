<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock — Administration ATLAS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="app">
  <main class="principal">

    <div class="entete-page">
      <div>
        <h1 class="titre-page">Stock</h1>
        <p class="sous-titre">Une ligne = une taille. Corrigez la quantité dans la ligne, puis Entrée. Les ruptures remontent en premier.</p>
      </div>
      <button class="btn" type="button" data-recharger>Recharger</button>
    </div>

    <!-- Vide et masqué tant qu'il n'y a qu'un seul entrepôt : un
         sélecteur à une seule option est un bouton qui ne fait rien. -->
    <section class="panneau panneau--entrepot" data-entrepot hidden></section>

    <div class="recherche-boite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input type="search" data-recherche placeholder="Rechercher (insensible aux accents)…" aria-label="Rechercher une taille">
    </div>

    <div class="panneau">
      <div class="table-boite">
        <table>
          <thead>
            <tr><th></th><th>Produit</th><th>Taille</th><th>Référence</th><th class="num">Stock</th><th class="num">Quantité</th></tr>
          </thead>
          <tbody data-liste><tr><td colspan="6" class="chargement">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/stock.js"></script>
</body>
</html>
