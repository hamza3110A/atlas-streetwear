<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — Administration ATLAS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="app">
  <main class="principal">

    <div class="entete-page">
      <div>
        <h1 class="titre-page">Clients</h1>
        <p class="sous-titre">Un client = un numéro de téléphone. Ses commandes se rattachent toutes seules.</p>
      </div>
    </div>

    <div class="recherche-boite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input type="search" data-recherche placeholder="Nom, téléphone, ville…" aria-label="Rechercher un client">
    </div>

    <div class="panneau">
      <div class="table-boite">
        <table>
          <thead><tr><th>Client</th><th>Ville</th><th class="num">Commandes</th><th class="num">Total acheté</th><th>Dernière</th><th></th></tr></thead>
          <tbody data-liste><tr><td colspan="6" class="chargement">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/clients.js"></script>
</body>
</html>
