<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotions — Administration ATLAS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="app">
  <main class="principal">

    <div class="entete-page">
      <div>
        <h1 class="titre-page">Promotions</h1>
        <p class="sous-titre">Codes de réduction. La remise est toujours recalculée par le serveur au moment de la commande.</p>
      </div>
      <button class="btn btn--primaire" type="button" data-nouveau>+ Nouveau code</button>
    </div>

    <div class="panneau">
      <div class="table-boite">
        <table>
          <thead><tr><th>Code</th><th>Type</th><th class="num">Valeur</th><th class="num">Minimum</th><th class="num">Utilisé</th><th>État</th><th></th></tr></thead>
          <tbody data-liste><tr><td colspan="7" class="chargement">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/promotions.js"></script>
</body>
</html>
