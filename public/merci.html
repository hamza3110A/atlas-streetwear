<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commande enregistrée — ATLAS STREETWEAR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">

<body data-sans-bandeau>
<main class="page page-etroite" id="contenu">
  <div class="vide">
    <img src="/img/mark-clair.png" alt="">
    <h1 class="titre-section">Commande <span class="accent">enregistrée</span></h1>
    <p class="mono">Référence <strong data-reference>—</strong></p>
    <p>Nous vous appelons pour confirmer avant l'expédition. Le paiement se fait au livreur, en main propre.</p>
  </div>

  <section class="recap" data-recap hidden>
    <h2>Détail</h2>
    <div data-lignes></div>
    <div class="recap-ligne"><span>Sous-total</span><span data-sous-total></span></div>
    <div class="recap-ligne recap-ligne--remise" data-ligne-remise hidden><span>Remise</span><span data-remise></span></div>
    <div class="recap-ligne"><span>Livraison</span><span data-livraison></span></div>
    <div class="recap-ligne recap-ligne--total"><span>À payer au livreur</span><span data-total></span></div>
    <p class="recap-note" data-delai></p>
  </section>

  <p class="mono texte-gris"><a class="lien-fleche" href="/boutique">Continuer mes achats</a></p>
</main>

<script src="/js/i18n.js"></script>
