# /etc/nginx/sites-available/atlas
#
#   sudo ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domaine réel : atlastreetwear.com (acheté chez OVH le 20/09/2026).
# Serveur : vps-26f80b32.vps.ovh.net — 145.239.73.66

server {
    listen 80;
    listen [::]:80;
    server_name atlastreetwear.com www.atlastreetwear.com;

    # certbot insère ici la redirection vers HTTPS et gère le renouvellement.
    # Tant que le certificat n'est pas posé, le site répond en HTTP : c'est
    # normal, et la connexion à l'administration fonctionne quand même — le
    # cookie n'est pas marqué « Secure » tant que la requête n'est pas en
    # HTTPS. C'est exactement le comportement voulu.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # X-Forwarded-Proto : c'est CE en-tête que l'application lit pour
        # décider si le cookie de session doit porter le drapeau Secure.
        # S'il manque ou s'il est faux, la connexion à l'administration
        # échoue sans message d'erreur. Ne le retirez jamais.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        proxy_read_timeout 60s;
    }

    # Les photos produit font jusqu'à 8 Mo côté application. Si nginx
    # accepte moins, l'envoi échoue avec un « 413 » que personne ne
    # comprend. On garde une marge.
    client_max_body_size 12M;

    # Compression du texte. Les JPEG et WebP sont déjà compressés.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    access_log /var/log/nginx/atlas-access.log;
    error_log  /var/log/nginx/atlas-error.log;
}

# ---------------------------------------------------------------------
# Après « sudo certbot --nginx -d atlastreetwear.com -d www.atlastreetwear.com »,
# certbot réécrit ce fichier : il ajoute un bloc « listen 443 ssl », les
# chemins des certificats, et transforme le bloc 80 en redirection 301.
# Vérifiez ensuite que le bloc 443 contient TOUJOURS la ligne
# proxy_set_header X-Forwarded-Proto $scheme ;  certbot la recopie en
# principe, mais c'est la ligne dont dépend la connexion à l'admin.
# ---------------------------------------------------------------------
